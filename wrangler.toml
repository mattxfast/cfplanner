name = "fitfactory"
main = "src/worker.js"
compatibility_date = "2026-11-13"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "fitfactory"
database_id = "adad0c5a-186a-4511-84e6-342420d78d10"
migrations_dir = "migrations"

[vars]
ADMIN_EMAIL = "mattxfast@gmail.com"

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
# 03:17 UTC : purge des sessions et tentatives expirées ; chaque minute : rappels par paquets (heure de Paris).
crons = ["17 3 * * *", "* * * * *"]
